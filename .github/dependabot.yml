version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    # Dependencies are unpinned ranges in pyproject.toml; only security-
    # relevant bumps are worth a PR here.
    open-pull-requests-limit: 5
