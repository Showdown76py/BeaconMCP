name: CI

on:
  # Branch-scoped so a push to a branch with an open PR doesn't run twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the Docker image runs on.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # constraints.txt is the dependency set the self-update and the
        # installer use, so CI tests exactly that.
        run: pip install -e ".[wizard,dev]" -c constraints.txt

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: pytest -q

  # beaconmcp.yaml.example is the documented schema. If a config key is renamed
  # in the loader without updating the template, this catches it.
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e . -c constraints.txt

      - name: Validate the example config
        # The template references secrets as ${VAR} and the loader rejects
        # unset ones, so feed it throwaway values.
        env:
          BEACONMCP_SESSION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          GEMINI_API_KEY: ci-dummy
          PVE1_TOKEN_SECRET: ci-dummy
          PVE2_TOKEN_SECRET: ci-dummy
          RACK1_ILO_PASSWORD: ci-dummy
          RACK2_IPMI_PASSWORD: ci-dummy
          RACK3_IDRAC_PASSWORD: ci-dummy
          VPS2_PW: ci-dummy
        run: |
          beaconmcp validate-config --config beaconmcp.yaml.example
          # The gate a self-update must pass: every module imports and the
          # HTTP app builds and answers /health with this config.
          beaconmcp check-startup --config beaconmcp.yaml.example

  # Templates, static files and the logo ride along implicitly with the package
  # directory. A missing one only surfaces when the dashboard renders, so assert
  # on the built artifact here.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Assert packaged data files are present
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile

          names = zipfile.ZipFile(next(pathlib.Path("dist").glob("*.whl"))).namelist()
          for prefix in ("beaconmcp/assets/logo.webp",
                         "beaconmcp/dashboard/templates/",
                         "beaconmcp/dashboard/static/"):
              if not any(n.startswith(prefix) for n in names):
                  sys.exit(f"wheel is missing {prefix}")
          PY

      - name: Install the wheel in a clean env and smoke-test the CLI
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl -c constraints.txt
          /tmp/smoke/bin/beaconmcp --help

      # --help and validate-config never import the MCP SDK, so exercise the
      # real import path here: an SDK API break must fail CI.
      - name: Import the server modules from the installed wheel
        env:
          BEACONMCP_CONFIG: beaconmcp.yaml.example
          BEACONMCP_SESSION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          GEMINI_API_KEY: ci-dummy
          PVE1_TOKEN_SECRET: ci-dummy
          PVE2_TOKEN_SECRET: ci-dummy
          RACK1_ILO_PASSWORD: ci-dummy
          RACK2_IPMI_PASSWORD: ci-dummy
          RACK3_IDRAC_PASSWORD: ci-dummy
          VPS2_PW: ci-dummy
        run: /tmp/smoke/bin/python -c 'import beaconmcp.server, beaconmcp.dashboard.mcp_bridge'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: beaconmcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the entrypoint
        run: docker run --rm beaconmcp:ci --help

      # The image sets BEACONMCP_CONFIG=/config/beaconmcp.yaml and the server
      # module loads the config at import, so mount the example there.
      - name: Import the server module inside the image
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/beaconmcp.yaml.example:/config/beaconmcp.yaml:ro" \
            -e BEACONMCP_SESSION_KEY=MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= \
            -e GEMINI_API_KEY=ci-dummy -e PVE1_TOKEN_SECRET=ci-dummy \
            -e PVE2_TOKEN_SECRET=ci-dummy -e RACK1_ILO_PASSWORD=ci-dummy \
            -e RACK2_IPMI_PASSWORD=ci-dummy -e RACK3_IDRAC_PASSWORD=ci-dummy \
            -e VPS2_PW=ci-dummy \
            beaconmcp:ci -c 'import beaconmcp.server'
