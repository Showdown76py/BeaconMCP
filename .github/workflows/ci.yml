name: CI

on:
  # Branch-scoped so a push to a branch with an open PR doesn't run twice.
  push:
    branches: [main]
  pull_request:

# A new push to the same ref cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the Docker image runs on.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[wizard,dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: pytest -q

  # beaconmcp.yaml.example is the documented schema. If a config key is renamed
  # in the loader without updating the template, this catches it.
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Validate the example config
        # The template references secrets as ${VAR} and the loader rejects
        # unset ones, so feed it throwaway values.
        env:
          BEACONMCP_SESSION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          GEMINI_API_KEY: ci-dummy
          PVE1_TOKEN_SECRET: ci-dummy
          PVE2_TOKEN_SECRET: ci-dummy
          RACK1_ILO_PASSWORD: ci-dummy
          RACK2_IPMI_PASSWORD: ci-dummy
          SSH_ROOT_PW: ci-dummy
          VPS2_PW: ci-dummy
          VAR_NAME: ci-dummy
        run: beaconmcp validate-config --config beaconmcp.yaml.example

  # The wheel ships templates/static/logo through force-include; a missing
  # entry only surfaces at runtime, so assert on the built artifact instead.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Assert packaged data files are present
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "beaconmcp/assets/logo.webp",
              "beaconmcp/dashboard/templates/",
              "beaconmcp/dashboard/static/",
          ]
          missing = [r for r in required if not any(n.startswith(r) for n in names)]
          if missing:
              sys.exit(f"{wheel.name} is missing: {missing}")
          print(f"{wheel.name}: packaged data files OK")
          PY

      - name: Install the wheel in a clean env and smoke-test the CLI
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/beaconmcp --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: beaconmcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the entrypoint
        run: docker run --rm beaconmcp:ci --help
