<!doctype html>
<meta charset="utf-8">
<title>VM control panel</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --danger: #dc2626;
    --ok: #16a34a;
    --track: #f3f4f6;
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1c;
    --fg: #ededed;
    --muted: #9ca3af;
    --line: #333333;
    --accent: #60a5fa;
    --danger: #f87171;
    --ok: #4ade80;
    --track: #2a2a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 14px;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.45 var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .badge {
    padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
    border: 1px solid var(--line); color: var(--muted);
  }
  .badge[data-status="running"] { color: var(--ok); border-color: currentColor; }
  .badge[data-status="stopped"] { color: var(--muted); }
  .badge[data-status="paused"] { color: var(--accent); border-color: currentColor; }

  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 14px 0; }
  .metric { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
  .metric .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .metric .value { font-size: 15px; font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; border-radius: 2px; background: var(--track); margin-top: 7px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }

  fieldset { border: 0; margin: 0; padding: 0; }
  fieldset[disabled] { opacity: .55; }
  .row { display: flex; flex-wrap: wrap; gap: 7px; align-items: flex-end; }
  button {
    font: inherit; padding: 6px 13px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--fg);
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { cursor: not-allowed; opacity: .45; }
  button.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  input {
    font: inherit; width: 84px; padding: 5px 7px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 8px; }
  .note {
    margin-top: 12px; padding: 8px 10px; border-radius: 6px; font-size: 12px;
    border: 1px solid var(--line);
  }
  .note[data-kind="error"] { color: var(--danger); border-color: currentColor; }
  .note[data-kind="ok"] { color: var(--ok); border-color: currentColor; }
  [hidden] { display: none !important; }
</style>

<div id="loading" class="sub">Loading…</div>

<main id="panel" hidden>
  <header>
    <div>
      <h1 id="name"></h1>
      <div class="sub" id="where"></div>
    </div>
    <span class="badge" id="status"></span>
  </header>

  <div class="metrics">
    <div class="metric">
      <div class="label">CPU</div>
      <div class="value" id="cpu"></div>
      <div class="bar"><i id="cpu-bar"></i></div>
    </div>
    <div class="metric">
      <div class="label">Memory</div>
      <div class="value" id="mem"></div>
      <div class="bar"><i id="mem-bar"></i></div>
    </div>
    <div class="metric">
      <div class="label">Disk</div>
      <div class="value" id="disk"></div>
      <div class="bar"><i id="disk-bar"></i></div>
    </div>
    <div class="metric">
      <div class="label">Uptime</div>
      <div class="value" id="uptime"></div>
    </div>
  </div>

  <fieldset id="controls">
    <div class="section-title">Power</div>
    <div class="row">
      <button id="start">Start</button>
      <button id="restart">Restart</button>
      <button id="stop" class="danger">Stop</button>
      <button id="refresh" style="margin-left:auto">Refresh</button>
    </div>

    <hr>

    <div class="section-title">Resources</div>
    <div class="row">
      <div>
        <label for="cores">CPU cores</label>
        <input id="cores" type="number" min="1" max="128" step="1">
      </div>
      <div>
        <label for="memory">Memory (MB)</label>
        <input id="memory" type="number" min="16" max="1048576" step="16">
      </div>
      <button id="apply">Apply</button>
    </div>
  </fieldset>

  <div class="note" id="note" hidden></div>
</main>

<script>
(() => {
  "use strict";

  const PROTOCOL_VERSION = "2026-01-26";

  let nextId = 0;
  const pending = new Map();
  let vm = null;

  const $ = (id) => document.getElementById(id);

  function post(message) {
    window.parent.postMessage(message, "*");
  }

  function request(method, params) {
    const id = ++nextId;
    post({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }

  function notify(method, params) {
    post({ jsonrpc: "2.0", method, params });
  }

  // The host owns the iframe's height, so it has to be told when the content
  // reflows -- otherwise the panel renders into a fixed sliver.
  function reportSize() {
    notify("ui/notifications/size-changed", {
      width: document.documentElement.scrollWidth,
      height: document.documentElement.scrollHeight,
    });
  }

  function applyHostContext(ctx) {
    if (!ctx) return;
    if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) {
      for (const [key, value] of Object.entries(vars)) {
        document.documentElement.style.setProperty(key, value);
      }
    }
  }

  function setNote(text, kind) {
    const note = $("note");
    note.textContent = text || "";
    note.hidden = !text;
    if (text) note.dataset.kind = kind;
    reportSize();
  }

  function pct(used, max) {
    return max > 0 ? Math.min(100, (used / max) * 100) : 0;
  }

  function render(data) {
    vm = data;
    $("loading").hidden = true;
    $("panel").hidden = false;

    $("name").textContent = data.name || `${data.type} ${data.vmid}`;
    $("where").textContent = `${data.type.toUpperCase()} ${data.vmid} on ${data.node}`;
    $("status").textContent = data.status;
    $("status").dataset.status = data.status;

    $("cpu").textContent = `${data.cpu_pct}%${data.cpus ? ` of ${data.cpus}` : ""}`;
    $("cpu-bar").style.width = `${Math.min(100, data.cpu_pct)}%`;

    $("mem").textContent = `${data.mem_used_mb} / ${data.mem_max_mb} MB`;
    $("mem-bar").style.width = `${pct(data.mem_used_mb, data.mem_max_mb)}%`;

    // null means the guest never reported usage (QEMU without a guest agent),
    // which is different from "0 bytes used" and must not render as an empty bar.
    if (data.disk_used_gb === null || data.disk_used_gb === undefined) {
      $("disk").textContent = `${data.disk_max_gb} GB provisioned`;
      $("disk-bar").style.width = "0%";
    } else {
      $("disk").textContent = `${data.disk_used_gb} / ${data.disk_max_gb} GB`;
      $("disk-bar").style.width = `${pct(data.disk_used_gb, data.disk_max_gb)}%`;
    }

    $("uptime").textContent = data.status === "running" ? `${data.uptime_h} h` : "—";

    if (document.activeElement !== $("cores")) $("cores").value = data.cores ?? "";
    if (document.activeElement !== $("memory")) $("memory").value = data.memory_mb ?? "";

    const running = data.status === "running";
    $("start").disabled = running;
    $("stop").disabled = !running;
    $("restart").disabled = !running;

    reportSize();
  }

  // A CallToolResult carries the dict in structuredContent, but a host that
  // strips it still sends the JSON as text -- fall back rather than blank out.
  function unwrap(result) {
    if (result && result.structuredContent) return result.structuredContent;
    const first = result && result.content && result.content[0];
    if (first && first.type === "text") {
      try { return JSON.parse(first.text); } catch { return null; }
    }
    return null;
  }

  async function callTool(name, args) {
    const result = await request("tools/call", { name, arguments: args });
    const data = unwrap(result);
    if (result && result.isError) {
      throw new Error((data && data.error) || "tool call failed");
    }
    if (data && data.error) throw new Error(data.error);
    return data;
  }

  async function run(label, fn) {
    $("controls").disabled = true;
    setNote(`${label}…`, "ok");
    try {
      await fn();
      const fresh = await callTool("proxmox_vm_panel", { node: vm.node, vmid: vm.vmid });
      if (fresh) render(fresh);
      setNote(`${label} done.`, "ok");
    } catch (err) {
      setNote(err.message || String(err), "error");
    } finally {
      $("controls").disabled = false;
    }
  }

  $("start").onclick = () => run("Starting", () =>
    callTool("proxmox_vm_start", { node: vm.node, vmid: vm.vmid }));

  $("stop").onclick = () => run("Stopping", () =>
    callTool("proxmox_vm_stop", { node: vm.node, vmid: vm.vmid }));

  $("restart").onclick = () => run("Restarting", () =>
    callTool("proxmox_vm_restart", { node: vm.node, vmid: vm.vmid }));

  $("refresh").onclick = () => run("Refreshing", async () => {});

  $("apply").onclick = () => {
    const updates = {};
    const cores = parseInt($("cores").value, 10);
    const memory = parseInt($("memory").value, 10);
    if (cores && cores !== vm.cores) updates.cores = cores;
    if (memory && memory !== vm.memory_mb) updates.memory = memory;
    if (!Object.keys(updates).length) {
      setNote("Nothing changed.", "ok");
      return;
    }
    run("Applying", () =>
      callTool("proxmox_vm_config", { node: vm.node, vmid: vm.vmid, updates }));
  };

  window.addEventListener("message", (event) => {
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;

    if (message.id != null && pending.has(message.id)) {
      const { resolve, reject } = pending.get(message.id);
      pending.delete(message.id);
      if (message.error) reject(new Error(message.error.message || "request failed"));
      else resolve(message.result);
      return;
    }

    switch (message.method) {
      case "ui/notifications/tool-result": {
        const data = unwrap(message.params);
        if (data && data.error) setNote(data.error, "error");
        else if (data) render(data);
        break;
      }
      case "ui/notifications/host-context-changed":
        applyHostContext(message.params);
        break;
      case "ui/resource-teardown":
        post({ jsonrpc: "2.0", id: message.id, result: {} });
        break;
    }
  });

  request("ui/initialize", {
    protocolVersion: PROTOCOL_VERSION,
    capabilities: { appCapabilities: { availableDisplayModes: ["inline"] } },
    clientInfo: { name: "beaconmcp-vm-panel", version: "1.0.0" },
  }).then((result) => {
    applyHostContext(result && result.hostContext);
    notify("ui/notifications/initialized", {});
    reportSize();
  });
})();
</script>
